name: Verify and prepare unsigned candidate

on:
  pull_request:
  push:
    branches: [main, 'chore/**', 'fix/**', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint:js
      - run: npm run check:dependencies
      - run: npm run audit:dependencies
      - run: npm run build
      - run: npm run check:build
      - run: npm run check:extension
      - run: npm run check:outgoing
      - run: node scripts/check-outgoing.cjs --history=HEAD
      - run: npm run prepare:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-candidate-${{ matrix.os }}
          path: artifacts/mendosave-*/
          if-no-files-found: error
          retention-days: 14
  reproducibility:
    needs: verify
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unsigned-candidate-*
          path: candidates
      - name: Compare Windows and Linux archive hashes
        run: cmp candidates/unsigned-candidate-ubuntu-24.04/SHA256SUMS candidates/unsigned-candidate-windows-2025/SHA256SUMS
