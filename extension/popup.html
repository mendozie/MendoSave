<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>MendoSave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="head">
    <img src="icons/48.png" alt="" width="28" height="28">
    <div class="titles">
      <b>MendoSave</b>
      <span class="subtitle">
        <span id="current-version">v…</span>

      </span>
    </div>
  </div>
  <div id="status" class="status">Локальный тестовый кандидат. Для ручной проверки.</div>

  <div class="section">
    <div class="section-head">Сохранение файлов</div>
    <label class="setting-row check" for="save-as">
      <input id="save-as" type="checkbox">
      <span>Спрашивать, куда сохранить</span>
    </label>
    <div class="hint">Выключено - стандартная папка загрузок браузера. Включено - штатный диалог для каждого файла или ZIP.</div>
  </div>

  <div class="section">
    <div class="section-head">Качество плеера</div>

    <div class="setting">
      <label class="setting-row" for="yt-quality">
        <span class="setting-name">YouTube</span>
        <select id="yt-quality"></select>
      </label>
      <label class="setting-row check" for="yt-lock">
        <input id="yt-lock" type="checkbox">
        <span>Запретить понижение качества</span>
      </label>
    </div>

    <div class="setting">
      <label class="setting-row" for="tw-quality">
        <span class="setting-name">Twitch</span>
        <select id="tw-quality"></select>
      </label>
      <label class="setting-row check" for="tw-lock">
        <input id="tw-lock" type="checkbox">
        <span>Запретить понижение качества</span>
      </label>
    </div>

    <div id="settings-hint" class="hint">
      «Как у монитора» - по разрешению экрана, на котором открыта вкладка.
    </div>
  </div>

  <div id="recovered" class="status update" hidden></div>
  <button id="save-recovered" class="export-log" type="button" hidden>Сохранить готовый файл</button>
  <button id="export-log" class="export-log" type="button">Сохранить журнал диагностики</button>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
